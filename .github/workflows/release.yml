name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release source and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Stable vX.Y.Z tag required');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          if (tag !== `v${plugin.version}`) throw new Error('Tag must match plugin version');
          const [pinned, method] = fs.readFileSync('scripts/release.tsv', 'utf8').trim().split(/\s+/);
          if (pinned !== tag || method !== 'attested') throw new Error('Tag must match attested installer pin');
          JS
      - name: Build four platform executables
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/build-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - name: Attest raw executable bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/release/chronicle-mcp-*
      - name: Verify attestations before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          for binary in "$RUNNER_TEMP"/release/chronicle-mcp-*; do
            gh attestation verify "$binary" --repo "$RELEASE_REPO" \
              --signer-workflow "$RELEASE_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          done
      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/chronicle-mcp-* \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
