name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Use a canonical temporary directory
        # macOS /var is a symlink; private-state tests reject symlink ancestors.
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_ENV, "TMPDIR=" + fs.realpathSync(process.env.RUNNER_TEMP) + "\n");'
      - run: npm ci
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm test
      - run: git diff --check
      - name: Cross-build release targets
        shell: bash
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/relay/relay.go)
          sh scripts/build-release.sh "v$version" "$RUNNER_TEMP/release"
